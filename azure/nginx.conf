server {
    listen 8080;
    listen [::]:8080;
    root /home/site/wwwroot;
    index index.php index.html index.htm;
    server_name _;

    # Reescritura para el patrÃ³n Front Controller (MVC) -> index.php
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Desactivar logs para favicon y robots
    location = /favicon.ico { log_not_found off; access_log off; }
    location = /robots.txt  { log_not_found off; access_log off; }

    # Bloquear acceso a archivos ocultos (.env, .git, etc.) por seguridad
    location ~ /\. {
        deny all;
    }

    # Bloquear acceso directo web a carpetas internas del framework y documentaciÃ³n
    location ~ ^/(app|docs|plan|azure)/ {
        deny all;
    }

    # Procesar archivos PHP con PHP-FPM
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_read_timeout 300;
    }
}
